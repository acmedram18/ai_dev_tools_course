{% extends "chores/base.html" %}

{% block title %}Members · ChoreBalancer{% endblock %}

{% block content %}
  <h1>Members</h1>
  <ul>
    {% for member in members %}
      <li>{{ member.name }}</li>
    {% empty %}
      <li>No members yet.</li>
    {% endfor %}
  </ul>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add member</button>
  </form>
{% endblock %}
